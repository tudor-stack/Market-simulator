repos:
  # --- General file hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: '^web/tsconfig.*\.json$'

  # --- C++ formatting (pinned clang-format, downloaded by pre-commit) ---
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        exclude: "third_party/"

  - repo: local
    hooks:
      # --- Commit message must match: type/number_name: message ---
      - id: commit-msg-format
        name: commit message format check
        entry: python scripts/hooks/check_commit_msg.py
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true

      # --- Branch name must match convention ---
      - id: branch-name-check
        name: branch name convention check
        entry: python scripts/hooks/check_branch_name.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
